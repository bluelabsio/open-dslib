# p_win_2026 crosstab: age / party / region, plus topline.
#
# Built from a chat request: "I have a new model score p_win_2026 in
# c_tfp.model_scores_20260801, joined to the usual basetable on
# voterbase_id. I want to crosstab it by age, party, and region, plus a
# topline. Output to Google Sheets, sheet ID abc123, tab 'Win Score
# Topline'."
#
# Assumptions made to fill gaps in the request (no live requester available
# to confirm — flagged inline, and called out again in the accompanying
# transcript):
#   1. "the usual basetable" -> c_tfp.co_modeling_basetable_20260622, the
#      standard basetable already used by every other config in this repo
#      (examples/model3_universe_tabs.yaml, examples/counterfactual_example.yaml,
#      configs/model3_universe_tabs.yaml). Confirm this is still the current
#      basetable before running.
#   2. Score column name inside c_tfp.model_scores_20260801 -> assumed to
#      match the score's given name, p_win_2026, per this repo's naming
#      convention (e.g. p_support / p_support_standardized in the m3
#      example). Confirm the literal column name before running.
#   3. Age / Party / Region basetable column names -> age_bucket_full,
#      party, co_region, matching the same columns used for these exact
#      dimensions in examples/model3_universe_tabs.yaml (same basetable).
#   4. model_version identifier -> "p_win_2026_20260801", following the
#      <score_name>_<source table's date suffix> convention used elsewhere
#      (e.g. p_support_v3_20260416).
#   5. Aggregations -> left at the tool default (mean + count), appropriate
#      for a numeric win-probability score; no request for additional
#      stats (e.g. median) was made.
#   6. Output layout -> "long" (tidy), the tool default and the shape every
#      other config in this repo uses.
#   7. run_metadata -> left at defaults (capture provenance + the executed
#      SQL) so the sheet's origin is reproducible.

job:
  name: p_win_2026_crosstab
  model_version: p_win_2026_20260801
  notes: >
    Crosstab of the new p_win_2026 model score (c_tfp.model_scores_20260801)
    by age, party, and region, plus topline. Scores table joined to the
    standard basetable on voterbase_id. Requested via chat 2026-07-30.

sources:
  - name: scores
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.model_scores_20260801
  - name: basetable
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.co_modeling_basetable_20260622  # "the usual basetable" — confirm still current

base:
  from: scores
  joins:
    - source: basetable
      key: voterbase_id
      how: left

scores:
  - name: p_win_2026
    source: scores
    column: p_win_2026  # placeholder — confirm actual column name in c_tfp.model_scores_20260801

counterfactuals: []

include_topline: true

grouping_variables:
  - label: "01 Age"
    column: age_bucket_full
  - label: "02 Party"
    column: party
  - label: "03 Region"
    column: co_region

aggregations:
  default: [mean, count]

cross_column: []

output:
  destination: google_sheets
  spreadsheet_id: "abc123"
  tab: "Win Score Topline"
  layout: long

run_metadata:
  capture: true
  save_sql: true
  artifacts_dir: "runs"
  notes: "p_win_2026 crosstab by age/party/region + topline, requested via chat 2026-07-30"
