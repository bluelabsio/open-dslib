# Derived from examples/model3_universe_tabs.yaml (the "m3 Universe Tabs"
# reproduction of Requirements Doc v0.2, Appendix A), edited per a request to:
#   1. add an "Education Level" grouping variable, and
#   2. switch output from Google Sheets to CSV (no sheet ready yet).
# The original examples/model3_universe_tabs.yaml is left untouched — this is
# a separate, runnable job config in configs/, not an edit-in-place of the
# reference example other docs point to.
#
# Placeholder column names (marked below) stand in for basetable columns
# not spelled out in Appendix A / the reference SQL snippet — confirm
# actual names against c_tfp.co_modeling_basetable_20260622 before running.
# "education_level" is a new placeholder added for this run — it has not
# been confirmed against the basetable at all (see note at the grouping
# variable itself).

job:
  name: model3_universe_tabs
  model_version: p_support_v3_20260416
  notes: >
    Config-driven generalization of the existing bespoke Model 3
    Universe Tabs SQL. Grouping variables and ordering mirror Appendix A,
    plus an added Education Level breakdown. Output set to CSV pending a
    destination Google Sheet.

sources:
  - name: scores
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.plain_language_support_score_20260416
  - name: basetable
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.co_modeling_basetable_20260622

base:
  from: scores
  joins:
    - source: basetable
      key: voterbase_id
      how: left

scores:
  - name: p_support
    source: scores
    column: p_support
  - name: p_support_standardized
    source: scores
    column: p_support_standardized

counterfactuals: []

include_topline: true

grouping_variables:
  - label: "01 Age"
    column: age_bucket_full
  - label: "02 Female"
    column: gender
  - label: "03 Ethnicity"
    column: ethnicity
  - label: "04 Education Modeled"
    column: education_modeled          # placeholder — confirm column name
  - label: "05 Education Area"
    column: education_area             # placeholder — confirm column name
  - label: "06 Education Level"
    column: education_level            # placeholder — NEW, unconfirmed: no
                                        # column name was given for this;
                                        # confirm the actual "highest
                                        # education level" bucket column
                                        # against c_tfp.co_modeling_basetable_20260622
                                        # before running (distinct from the
                                        # modeled-score and field-of-study
                                        # columns above).
  - label: "07 Income"
    column: income_bucket              # placeholder — confirm column name
  - label: "08 Urbanicity"
    column: urbanicity
  - label: "09 CO Region"
    column: co_region
  - label: "10 Party"
    column: party
  - label: "11 Is Married"
    column: is_married
  - label: "12 Is Homeowner"
    column: is_homeowner
  - label: "13 2020 Vote Method"
    column: vote_method_2020           # placeholder — confirm column name
  - label: "14 2024 Vote Method"        # Appendix A lists this as "12" too
    column: vote_method_2024           # (likely a typo); renumbered here
                                        # (originally "13" in the example
                                        # this was derived from, shifted by
                                        # +1 for the new Education Level
                                        # variable) so ORDER BY 1, 2 stays
                                        # unambiguous.
                                        # placeholder — confirm column name

aggregations:
  default: [mean, count]

cross_column: []

output:
  destination: csv
  path: "output/model3_universe_tabs.csv"   # no destination sheet ready yet;
                                              # revisit once one exists
  layout: long

run_metadata:
  capture: true
  save_sql: true          # writes the exact executed SQL to <artifacts_dir>/<timestamp>_<job_name>.sql
  artifacts_dir: "runs"   # where per-run metadata JSON (+ saved SQL) lands; default is "runs"
  notes: "Reproduces Appendix A reference SQL via config, plus Education Level breakdown; CSV output pending sheet setup"
