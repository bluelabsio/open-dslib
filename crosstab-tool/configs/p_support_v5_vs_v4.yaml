# p_support_v5 vs. p_support_v4 comparison, broken out by age, party, and
# homeownership.
#
# Both scores live in the same table (c_tfp.support_scores_20260715), per
# the requester. The demographic/behavioral grouping columns (age, party,
# homeownership) live in a separate "basetable" that the requester referred
# to but did not name, and said to use reasonable guesses rather than
# blocking on confirmation.
#
# Per the crosstab-config-wizard skill: guesses are written in but flagged
# clearly below (never silently invented) so they fail loudly at
# validation/query time instead of quietly producing wrong output. The
# guesses are informed by two already-validated configs in this repo
# (examples/model3_universe_tabs.yaml and examples/counterfactual_example.yaml),
# which wire up c_tfp.co_modeling_basetable_20260622 as "the basetable",
# joined on voterbase_id, with unflagged (i.e. previously confirmed)
# age_bucket_full / party / is_homeowner columns. That is a stronger basis
# than a blind guess, but it is still an assumption for *this* job — confirm
# every flagged item below against the real schema before running against
# c_tfp.support_scores_20260715.

job:
  name: p_support_v5_vs_v4
  model_version: p_support_v5_20260715
  notes: >
    Compares newly re-run p_support_v5 against the prior p_support_v4 score
    (both columns in c_tfp.support_scores_20260715), grouped by age, party,
    and homeownership, with a computed v5-minus-v4 difference.

sources:
  - name: scores
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.support_scores_20260715
  - name: basetable
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.co_modeling_basetable_20260622  # ASSUMED — user did not name a basetable table; reusing the one already used for demographic grouping variables in examples/model3_universe_tabs.yaml and examples/counterfactual_example.yaml. Confirm this is still the correct/current basetable to join against c_tfp.support_scores_20260715.

base:
  from: scores
  joins:
    - source: basetable
      key: voterbase_id  # ASSUMED — user did not confirm the join key; voterbase_id matches the convention used in existing example configs. Confirm against both tables.
      how: left

scores:
  - name: p_support_v5
    source: scores
    column: p_support_v5
    kind: numeric

counterfactuals:
  - name: p_support_v4
    source: scores
    column: p_support_v4
    kind: numeric

include_topline: true

grouping_variables:
  - label: "01 Age"
    column: age_bucket_full  # placeholder — confirm column name against c_tfp.co_modeling_basetable_20260622. User was not sure of the exact age column; this guess is carried over from the existing basetable convention in examples/model3_universe_tabs.yaml rather than invented fresh.
  - label: "09 Party"
    column: party  # placeholder — confirm column name against c_tfp.co_modeling_basetable_20260622. Same basis as above; user was not sure of the exact column name.
  - label: "11 Is Homeowner"
    column: is_homeowner  # placeholder — confirm column name against c_tfp.co_modeling_basetable_20260622. Best guess for "homeownership"; user was not sure of the exact column name.

aggregations:
  default: [mean, count]

cross_column:
  - name: diff_v5_vs_v4
    op: difference
    inputs: [p_support_v5, p_support_v4]  # v5 - v4, i.e. positive = v5 scores higher. Both names are `scores`/`counterfactuals` entries (not raw column names), which is what the schema requires here. See transcript.md for how this was traced against query/builder.py + compute/cross_column.py to confirm it resolves at runtime (not just schema-valid).

output:
  destination: google_sheets
  spreadsheet_id: "REPLACE_WITH_SHEET_ID"  # no spreadsheet was provided — fill in before running
  tab: "p_support v5 vs v4"
  layout: long

run_metadata:
  capture: true
  save_sql: true
  artifacts_dir: "runs"
  notes: "v5 vs v4 support model comparison by age/party/homeownership, requested 2026-07-30"
