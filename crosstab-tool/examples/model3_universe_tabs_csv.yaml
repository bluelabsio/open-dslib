# Reproduces the existing hand-written "m3 Universe Tabs" SQL
# (Requirements Doc v0.2, Appendix A) as a config-driven job.
#
# Placeholder column names (marked below) stand in for basetable columns
# not spelled out in Appendix A / the reference SQL snippet — confirm
# actual names against c_tfp.co_modeling_basetable_20260622 before running.
#
# --- Variant of examples/model3_universe_tabs.yaml ---
# Requested changes vs. that file (original left untouched):
#   1. Added a new grouping variable for "Education Level" (see note below —
#      the original config already had "04 Education Modeled" and
#      "05 Education Area"; this adds a third, distinct education cut
#      rather than replacing either, since the request didn't say to
#      remove/rename the existing ones. Confirm with the requester whether
#      "education level" was meant to *be* one of those two instead of a
#      new column — flagging this explicitly since there was no one
#      available to confirm at config-authoring time).
#   2. Switched output.destination from google_sheets to csv (no sheet
#      ready yet), writing to output/model3_universe_tabs.csv instead of
#      spreadsheet_id/tab.

job:
  name: model3_universe_tabs
  model_version: p_support_v3_20260416
  notes: >
    Config-driven generalization of the existing bespoke Model 3
    Universe Tabs SQL. Grouping variables and ordering mirror Appendix A.

sources:
  - name: scores
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.plain_language_support_score_20260416
  - name: basetable
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.co_modeling_basetable_20260622

base:
  from: scores
  joins:
    - source: basetable
      key: voterbase_id
      how: left

scores:
  - name: p_support
    source: scores
    column: p_support
  - name: p_support_standardized
    source: scores
    column: p_support_standardized

counterfactuals: []

include_topline: true

grouping_variables:
  - label: "01 Age"
    column: age_bucket_full
    source: basetable
  - label: "02 Female"
    column: gender
    source: basetable
  - label: "03 Ethnicity"
    column: ethnicity
    source: basetable
  - label: "04 Education Modeled"
    column: education_modeled          # placeholder — confirm column name
    source: basetable
  - label: "05 Education Area"
    column: education_area             # placeholder — confirm column name
    source: basetable
  - label: "06 Income"
    column: income_bucket              # placeholder — confirm column name
    source: basetable
  - label: "07 Urbanicity"
    column: urbanicity
    source: basetable
  - label: "08 CO Region"
    column: co_region
    source: basetable
  - label: "09 Party"
    column: party
    source: basetable
  - label: "10 Is Married"
    column: is_married
    source: basetable
  - label: "11 Is Homeowner"
    column: is_homeowner
    source: basetable
  - label: "12 2020 Vote Method"
    column: vote_method_2020           # placeholder — confirm column name
    source: basetable
  - label: "13 2024 Vote Method"        # Appendix A lists this as "12" too
    column: vote_method_2024           # (likely a typo); renumbered 13 here
    source: basetable
                                        # so ORDER BY 1, 2 stays unambiguous.
                                        # placeholder — confirm column name
  - label: "14 Education Level"
    column: education_level            # placeholder — confirm column name;
    source: basetable
                                        # newly added per request. Distinct
                                        # from "04 Education Modeled" (a
                                        # modeled/predicted field) and
                                        # "05 Education Area" (field of
                                        # study) already above — confirm
                                        # this isn't a duplicate of one of
                                        # those before running.
aggregations:
  default: [mean, count]

cross_column: []

output:
  destination: csv
  path: "output/model3_universe_tabs.csv"
  layout: long

run_metadata:
  capture: true
  save_sql: true          # writes the exact executed SQL to <artifacts_dir>/<timestamp>_<job_name>.sql
  artifacts_dir: "runs"   # where per-run metadata JSON (+ saved SQL) lands; default is "runs"
  notes: "Reproduces Appendix A reference SQL via config. CSV-output variant of model3_universe_tabs.yaml — see header comment."
