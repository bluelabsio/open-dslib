# A second example showing the features Appendix A's query doesn't
# exercise: a counterfactual comparison column and a cross-column diff.

job:
  name: p_support_vs_prior_model
  model_version: p_support_v4_20260715
  notes: "Compares new model score against the prior model version as a counterfactual."

sources:
  - name: scores
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.plain_language_support_score_20260715
  - name: basetable
    type: redshift
    connection: REDSHIFT_MAIN
    table: c_tfp.co_modeling_basetable_20260622

base:
  from: scores
  joins:
    - source: basetable
      key: voterbase_id
      how: left

scores:
  - name: p_support
    source: scores
    column: p_support

counterfactuals:
  - name: p_support_prior
    source: scores
    column: p_support_v3
    kind: numeric

include_topline: true

grouping_variables:
  - label: "01 Age"
    column: age_bucket_full
  - label: "09 Party"
    column: party

aggregations:
  default: [mean, count]

cross_column:
  - name: diff_vs_prior
    op: difference
    inputs: [p_support, p_support_prior]

output:
  destination: google_sheets
  spreadsheet_id: "REPLACE_WITH_SHEET_ID"
  tab: "p_support v4 vs v3"
  layout: long

run_metadata:
  capture: true
