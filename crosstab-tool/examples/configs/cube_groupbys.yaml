# Auto-generated combinations (cube/rollup) instead of an explicit groupset list.
# Maps to CrosstabSpec.groupby -> CubeSpec, expanded via expand_to_groupsets() into the
# same flat list[list[str]] shape GroupBySpec produces -- the engine doesn't know or
# care which mode produced a given groupset.
#
# `options.cardinality_guardrail.max_groupset_count_x_cardinality` below is optional
# (core/validation.py only checks it when set, and only when the source can estimate its
# row count): it fails fast when groupset_count * estimated_row_count exceeds the
# threshold, rather than silently kicking off an enormous number of full-scan passes.

source:
  type: csv
  path: /data/scores/current.csv

score_columns:
  - model_score

groupby:
  type: cube
  columns: [region, product, age_bucket, channel]
  max_depth: 2          # cap combination size (2 of the 4 covariates at a time); omit for full 2^k power set
  include_empty: true   # also compute the ungrouped ("overall") crosstab as one of the groupsets

stats:
  - name: count
    column: model_score
  - name: mean
    column: model_score
  - name: percentile
    column: model_score
    params:
      q: 0.5

options:
  streaming: true
  # Fail fast rather than silently running an enormous number of tiny-group aggregations.
  cardinality_guardrail:
    max_groupset_count_x_cardinality: 5_000_000
